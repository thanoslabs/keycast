name: OBS Plugin
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS development libraries
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libobs-dev nlohmann-json3-dev
      - name: Configure
        run: cmake -S obs-plugin -B build/obs-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/obs-plugin --verbose
